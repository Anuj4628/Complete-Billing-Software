<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 400px; height: 300px;
      background: #0f172a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
      border-radius: 12px;
    }
    .logo-wrap {
      width: 80px; height: 80px; border-radius: 20px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(37,99,235,0.4);
    }
    .logo-text { color: white; font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
    .app-name { color: #f1f5f9; font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .tagline { color: #64748b; font-size: 12px; margin-bottom: 32px; }
    .bar-bg {
      width: 200px; height: 3px; background: #1e293b; border-radius: 99px; overflow: hidden;
    }
    .bar-fill {
      height: 100%; width: 0%; background: linear-gradient(90deg, #2563eb, #60a5fa);
      border-radius: 99px;
      animation: load 1.8s ease forwards;
    }
    .version { color: #334155; font-size: 10px; margin-top: 20px; }
    @keyframes load {
      0%   { width: 0%; }
      40%  { width: 60%; }
      70%  { width: 80%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="logo-wrap"><span class="logo-text">SM</span></div>
  <div class="app-name">Sunmarg Billing App</div>
  <div class="tagline">Smart Billing &amp; Inventory for Indian SMBs</div>
  <div class="bar-bg"><div class="bar-fill"></div></div>
  <div class="version">v1.0.0</div>
</body>
</html>
